name: Deploy to Cloudflare R2 / FreeAppStore

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build web application
        run: pnpm --filter web build

      - name: Deploy to FreeAppStore
        uses: freeappstore-online/deploy-action@v1
        with:
          app-id: formulapad
          dist-dir: web/dist
